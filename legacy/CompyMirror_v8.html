<!doctype html>
<html lang="ko" data-finish="chrome" data-irid="soft" data-glare="on">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CompyMirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="chrome.css" />
<link rel="stylesheet" href="micro.css" />
<style>
  .spinner{width:13px;height:13px;border-radius:50%;border:2px solid rgba(0,0,0,.18);border-top-color:currentColor;display:inline-block;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .enh-glint{position:relative}

  /* header right cluster + help button */
  .head-right{display:flex;align-items:center;gap:10px}
  .help-btn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    background:var(--glass-bg);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
    border:1px solid var(--glass-brd);color:var(--ink-2);box-shadow:var(--glass-in);transition:transform .14s,color .14s}
  .help-btn svg{width:18px;height:18px}
  .help-btn:hover{color:var(--ink);transform:translateY(-1px)}

  /* ── first-run coachmark tour ─────────────────────────────── */
  #tour{position:fixed;inset:0;z-index:320;display:none}
  #tour.on{display:block}
  #spot{position:absolute;left:0;top:0;width:0;height:0;border-radius:16px;
    box-shadow:0 0 0 9999px rgba(12,14,20,.66);pointer-events:none;
    outline:2px solid rgba(255,255,255,.92);outline-offset:0}
  #spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(120deg,#ff9ad5,#8fd9ff,#9affd0,#fff39a,#ffb39a);background-size:300% 300%;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    padding:2px;opacity:.85;animation:rim 8s linear infinite}
  @media (prefers-reduced-motion:reduce){#spot{transition:none}#spot::after{animation:none}}

  #tour-tip{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:392px;max-width:calc(100vw - 28px);
    padding:18px 20px 16px;border-radius:18px;
    background:linear-gradient(150deg,#ffffff 0%,#eef1f7 100%);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 24px 60px -18px rgba(14,18,30,.62), inset 0 1px 0 rgba(255,255,255,.9);
    color:#1c1f27;pointer-events:auto}
  html[data-finish="onyx"] #tour-tip{background:linear-gradient(150deg,#30343f 0%,#1b1e26 100%);border-color:rgba(255,255,255,.16);color:#eef0f6}
  .tip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .tip-count{font-family:var(--font-tech);font-size:12px;letter-spacing:.12em;color:#8a909d;font-variant-numeric:tabular-nums}
  .tip-count b{color:#1c1f27;font-weight:700;font-size:13px}
  html[data-finish="onyx"] .tip-count b{color:#eef0f6}
  .tip-skip{font-family:var(--font-sans);font-size:12.5px;font-weight:600;color:#8a909d;padding:4px 6px;border-radius:7px;transition:color .14s,background .14s}
  .tip-skip:hover{color:#1c1f27;background:rgba(0,0,0,.05)}
  html[data-finish="onyx"] .tip-skip:hover{color:#eef0f6;background:rgba(255,255,255,.08)}
  #tip-title{font-family:var(--font-sans);font-weight:800;font-size:19px;letter-spacing:-.015em;line-height:1.3;color:#15171f}
  html[data-finish="onyx"] #tip-title{color:#ffffff}
  #tip-body{font-size:14.5px;line-height:1.62;color:#3c414e;margin-top:9px}
  html[data-finish="onyx"] #tip-body{color:#c2c6d2}
  #tip-body b{font-weight:700;color:#15171f}
  html[data-finish="onyx"] #tip-body b{color:#ffffff}
  .tip-dots{display:flex;gap:6px;margin-top:16px}
  .tip-dots span{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.16);transition:background .2s,transform .2s}
  html[data-finish="onyx"] .tip-dots span{background:rgba(255,255,255,.2)}
  .tip-dots span.on{background:#15171f;transform:scale(1.25)}
  html[data-finish="onyx"] .tip-dots span.on{background:#fff}
  .tip-nav{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}
  .tip-nav .btn{height:40px;padding:0 20px;font-size:13.5px}
  .tip-prev[hidden]{display:none}
  @media (max-width:520px){
    #tour-tip{width:calc(100vw - 28px)}
  }
  /* during the tour, reveal the controls that are normally hidden until the camera starts */
  body.tour-live #bf,body.tour-live #bmode,body.tour-live #bbooth,body.tour-live #bsnap{display:inline-flex !important}
  body.tour-live #timer-btns{display:flex !important}
  body.tour-live #cam-row{}
</style>
</head>
<body>

<div id="holo"></div>
<div id="glare"></div>
<div id="grain"></div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e7eaf1"/><stop offset="1" stop-color="#9aa2b4"/>
      </linearGradient>
      <linearGradient id="tholo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc9e6"/><stop offset=".5" stop-color="#bfeaff"/><stop offset="1" stop-color="#c6ffe0"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="22" fill="url(#tbg)"/>
    <rect x="30" y="22" width="40" height="56" rx="12" fill="#15171f"/>
    <rect x="30" y="22" width="40" height="56" rx="12" fill="url(#tholo)" opacity=".55"/>
    <circle cx="50" cy="50" r="11" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="50" cy="50" r="4.5" fill="#fff"/>
  </svg>
</template>

<div class="shell">

  <header class="brandrow">
    <div class="brand">
      <span class="brand-mark">CompyMirror</span>
      <span class="brand-tag">Liquid Chrome Mirror</span>
    </div>
    <div class="head-right">
      <div class="privacy" title="모든 영상 처리는 이 브라우저 안에서만 일어납니다">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>
        </svg>
        <span><b>로컬 전용</b>· 영상·AI 처리 모두 기기 안에서</span>
      </div>
      <button class="help-btn" onclick="openGuide()" title="사용 가이드 다시 보기" aria-label="사용 가이드">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.6 2.3-2.6 4"/><line x1="12" y1="17.4" x2="12" y2="17.42"/></svg>
      </button>
    </div>
  </header>

  <main class="grid">

    <!-- ── stage ─────────────────────────────────────────────── -->
    <section class="stage">
      <div id="viewfinder" class="viewfinder" data-mode="auto">
        <div class="ph" id="ph">
          <div class="ph-disc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </div>
          <div class="ph-text">카메라가 꺼져 있습니다<small>아래 “카메라 시작”을 눌러 거울을 켜세요</small></div>
        </div>
        <video id="vid" autoplay playsinline muted></video>
        <canvas id="cv"></canvas>
        <div id="booth-progress"></div>
        <div id="countdown"></div>
        <div id="flash"></div>
        <div class="vf-corner" id="rec"><span class="dot"></span><span>LIVE</span></div>
      </div>

      <div class="controls">
        <button id="bs" class="btn primary" onclick="startCam()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          카메라 시작
        </button>
        <button id="bx" class="btn danger" onclick="stopCam()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l3-3h6"/><path d="M9 13a3 3 0 1 0 5.12 2.12"/></svg>
          끄기
        </button>
        <button id="bf" class="btn" onclick="toggleFlip()" style="display:none" title="좌우 반전">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 7 7 7 7 3"/><line x1="7" y1="7" x2="3" y2="11"/><polyline points="21 17 17 17 17 21"/><line x1="17" y1="17" x2="21" y2="13"/><path d="M12 3v18"/></svg>
          반전
        </button>
        <button id="bmode" class="btn" onclick="cycleMode()" style="display:none" title="비율 전환 (원본 → 9:16 → 1:1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
          <span id="bmode-lbl">원본</span>
        </button>
        <div class="cam-select" id="cam-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <select id="cam-sel" onchange="switchCam()"></select>
        </div>
        <div class="spacer"></div>
        <button id="bbooth" class="btn holo" onclick="startBooth()" style="display:none" title="3초 카운트다운 ×4컷">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="5" rx="1"/><rect x="4" y="10" width="16" height="5" rx="1"/><rect x="4" y="17" width="16" height="4" rx="1"/></svg>
          인생네컷
        </button>
        <button id="bsnap" class="btn primary" onclick="snap()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
          스냅샷
        </button>
      </div>

      <div class="timer-row" id="timer-btns">
        <span class="lbl">셀프 타이머</span>
        <button class="tb" onclick="timedSnap(3)">3s</button>
        <button class="tb" onclick="timedSnap(5)">5s</button>
        <button class="tb" onclick="timedSnap(10)">10s</button>
      </div>

      <!-- snapshot drawer -->
      <div id="snapbox" class="snap glass">
        <div class="snap-hd">
          <div class="left">
            <h3>방금 찍은 한 장</h3>
            <span class="when" id="snap-when"></span>
          </div>
          <div class="snap-actions">
            <button class="btn icon-only ig" onclick="shareSnap('story')" title="공유 시트에서 인스타 선택" aria-label="Instagram 공유">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="btn icon-only kakao" onclick="shareSnap('kakao')" title="공유 시트에서 카톡 선택" aria-label="카카오톡 공유">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9-.2.6-.7 2.3-.8 2.7 0 .2.1.4.3.2.3-.2 2.6-1.8 3.6-2.5.5.1 1.1.1 1.7.1 5 0 9-3.1 9-7s-4-7-9-7z"/></svg>
            </button>
            <button class="btn" onclick="shareSnap()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
              공유
            </button>
            <button id="snap-enh" class="btn holo" onclick="enhance(document.getElementById('sc'),this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/></svg>
              화질 향상
            </button>
            <button class="btn" onclick="downloadCanvas(document.getElementById('sc'),'compymirror')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              저장
            </button>
          </div>
        </div>
        <div class="snap-img-wrap"><canvas id="sc"></canvas></div>
      </div>
    </section>

    <!-- ── side panel ────────────────────────────────────────── -->
    <aside>
      <section class="panel glass">
        <div class="panel-hd"><h2>Preset</h2><span class="kicker">프리셋</span></div>
        <div class="panel-bd">
          <div class="presets">
            <button class="pb on" data-name="off" onclick="preset('off',this)"><span class="chip"></span>없음</button>
            <button class="pb" data-name="natural" onclick="preset('natural',this)"><span class="chip"></span>내추럴</button>
            <button class="pb" data-name="glow" onclick="preset('glow',this)"><span class="chip"></span>글로우</button>
            <button class="pb" data-name="vivid" onclick="preset('vivid',this)"><span class="chip"></span>비비드</button>
            <button class="pb" data-name="mono" onclick="preset('mono',this)"><span class="chip"></span>흑백</button>
            <button class="pb" data-name="warm" onclick="preset('warm',this)"><span class="chip"></span>웜톤</button>
            <button class="pb" data-name="cool" onclick="preset('cool',this)"><span class="chip"></span>쿨톤</button>
          </div>
        </div>
      </section>

      <section class="panel glass">
        <div class="panel-hd"><h2>Adjust</h2><span class="kicker">세부 조절</span></div>
        <div class="panel-bd">
          <div class="row"><span class="name">밝기</span><input type="range" id="fb" min="-100" max="100" step="1" value="0" oninput="sv('fb','vb')"><span class="val" id="vb">0</span></div>
          <div class="row"><span class="name">대비</span><input type="range" id="fc" min="-100" max="100" step="1" value="0" oninput="sv('fc','vc')"><span class="val" id="vc">0</span></div>
          <div class="row"><span class="name">채도</span><input type="range" id="fs" min="-100" max="100" step="1" value="0" oninput="sv('fs','vs')"><span class="val" id="vs">0</span></div>
          <div class="row"><span class="name">따뜻함</span><input type="range" id="fw" min="-80" max="80" step="1" value="0" oninput="sv('fw','vw')"><span class="val" id="vw">0</span></div>
          <div class="row"><span class="name">피부보정</span><input type="range" id="fk" min="0" max="8" step="1" value="0" oninput="sv('fk','vk')"><span class="val" id="vk">0</span></div>
          <div class="row"><span class="name">선명도</span><input type="range" id="fsh" min="0" max="100" step="1" value="0" oninput="sv('fsh','vsh')"><span class="val" id="vsh">0</span></div>
        </div>
        <div class="panel-foot"><button class="linkbtn" onclick="resetAll()">전체 초기화</button></div>
      </section>
    </aside>

  </main>
</div>

<!-- ── first-run coachmark tour ──────────────────────────────── -->
<div id="tour" aria-hidden="true">
  <div id="spot"></div>
  <div id="tour-tip" role="dialog" aria-modal="true" aria-labelledby="tip-title">
    <div class="tip-top">
      <span class="tip-count"><b id="tip-n">01</b> / <span id="tip-total">08</span></span>
      <button class="tip-skip" onclick="endTour()">건너뛰기</button>
    </div>
    <h3 id="tip-title">제목</h3>
    <p id="tip-body">설명</p>
    <div class="tip-dots" id="tip-dots"></div>
    <div class="tip-nav">
      <button class="btn tip-prev" id="tip-prev" onclick="tourPrev()">이전</button>
      <button class="btn primary tip-next" id="tip-next" onclick="tourNext()">다음</button>
    </div>
  </div>
</div>

<!-- ── photobooth result modal ───────────────────────────────── -->
<div id="booth-modal" class="modal">
  <div class="modal-card glass">
    <div class="modal-hd">
      <h2>인생네컷</h2>
      <button class="x" onclick="closeBooth()" aria-label="닫기">✕</button>
    </div>
    <div class="modal-bd">
      <canvas id="strip"></canvas>
      <div class="frame-pick">
        <span class="lbl">Frame</span>
        <button class="fsw on" data-f="silver" onclick="pickFrame('silver',this)" title="실버"></button>
        <button class="fsw" data-f="holo" onclick="pickFrame('holo',this)" title="홀로"></button>
        <button class="fsw" data-f="onyx" onclick="pickFrame('onyx',this)" title="오닉스"></button>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn" onclick="startBoothAgain()">다시 찍기</button>
      <button id="strip-enh" class="btn holo" onclick="enhance(document.getElementById('strip'),this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/></svg>
        화질 향상
      </button>
      <button class="btn" onclick="shareCanvas(document.getElementById('strip'),'compymirror_4cut','CompyMirror 인생네컷')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/><line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/></svg>
        공유
      </button>
      <button class="btn primary" onclick="downloadCanvas(document.getElementById('strip'),'compymirror_4cut')">저장</button>
    </div>
  </div>
</div>

<!-- ── tweaks ─────────────────────────────────────────────────── -->
<div id="tweaks" class="glass">
  <div class="tw-hd"><h4>Tweaks</h4><button class="tw-close" onclick="closeTweaks()" aria-label="닫기">✕</button></div>
  <div class="tw-bd">
    <div class="tw-row">
      <div class="tw-label">Finish</div>
      <div class="tw-opts" id="tw-finish">
        <button class="tw-opt" data-v="chrome">Chrome</button>
        <button class="tw-opt" data-v="onyx">Onyx</button>
      </div>
    </div>
    <div class="tw-row">
      <div class="tw-label">Iridescence</div>
      <div class="tw-opts" id="tw-irid">
        <button class="tw-opt" data-v="soft">Soft</button>
        <button class="tw-opt" data-v="vivid">Vivid</button>
      </div>
    </div>
    <div class="tw-row">
      <div class="tw-label">Interactive glare</div>
      <div class="tw-opts" id="tw-glare">
        <button class="tw-opt" data-v="on">On</button>
        <button class="tw-opt" data-v="off">Off</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════ Tweaks ═══════════════════ */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "finish": "chrome",
  "irid": "vivid",
  "glare": "on"
}/*EDITMODE-END*/;
let tweaks = {...TWEAK_DEFAULTS};
function applyTweaks(){
  document.documentElement.dataset.finish = tweaks.finish;
  document.documentElement.dataset.irid   = tweaks.irid;
  document.documentElement.dataset.glare  = tweaks.glare;
  [['tw-finish','finish'],['tw-irid','irid'],['tw-glare','glare']].forEach(([id,key])=>{

/* ═══════════════════ Interactive light (smooth follow) ═══════════════════ */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tgX=innerWidth/2, tgY=innerHeight*0.28;      // pointer target
let curX=tgX, curY=tgY;                            // eased current
let pointerSeen=false, lightRaf=0;
window.addEventListener('pointermove',(e)=>{
  tgX=e.clientX; tgY=e.clientY; pointerSeen=true;
  if(!lightRaf && !reduceMotion) lightRaf=requestAnimationFrame(lightLoop);
}, {passive:true});
function lightLoop(){
  // critically-damped easing → no jitter, gentle trail
  curX += (tgX-curX)*0.08;
  curY += (tgY-curY)*0.08;
  const w=innerWidth, h=innerHeight, s=document.documentElement.style;
  s.setProperty('--gx', curX.toFixed(1)+'px');
  s.setProperty('--gy', curY.toFixed(1)+'px');
  s.setProperty('--mxr', ((curX/w)*2-1).toFixed(3));
  s.setProperty('--myr', ((curY/h)*2-1).toFixed(3));
  if(Math.abs(tgX-curX)>0.4 || Math.abs(tgY-curY)>0.4){ lightRaf=requestAnimationFrame(lightLoop); }
  else lightRaf=0;
}
// rest the glare gently centered before any interaction
document.documentElement.style.setProperty('--gx', tgX+'px');
document.documentElement.style.setProperty('--gy', tgY+'px');

function presetFilter(name){
  const [b,c,s,w,k]=presets[name];
  const parts=[
    `brightness(${(1+b/180).toFixed(3)})`,
    `contrast(${(1+c/170).toFixed(3)})`,
    `saturate(${((s+100)/100).toFixed(3)})`
  ];
  if(w>0) parts.push(`sepia(${Math.min(0.6,w/110).toFixed(3)})`);
  else if(w<0) parts.push(`hue-rotate(${Math.round(w*0.32)}deg)`);
  if(k>0) parts.push(`blur(${(k*0.18).toFixed(2)}px)`);
  return parts.join(' ');
}

const MODE_ORDER=['auto','portrait','square'], MODE_LABEL={auto:'원본',portrait:'9:16',square:'1:1'};
function cycleMode(){ mode=MODE_ORDER[(MODE_ORDER.indexOf(mode)+1)%MODE_ORDER.length]; applyMode(); }
function applyMode(){
  const vf=document.getElementById('viewfinder');
  vf.dataset.mode=mode; document.getElementById('bmode-lbl').textContent=MODE_LABEL[mode];
  if(mode==='auto') vf.style.setProperty('--vf-ratio', camRatio);
  else if(mode==='portrait') vf.style.setProperty('--vf-ratio','9/16');
  else vf.style.setProperty('--vf-ratio','1/1');
}

function loop(){
  if(!stream) return;
  const vw=vid.videoWidth||640, vh=vid.videoHeight||480;
  const nr=vw/vh;
  if(Math.abs(nr-camRatio)>0.001){ camRatio=nr; if(mode==='auto') document.getElementById('viewfinder').style.setProperty('--vf-ratio', camRatio); }
  let target=camRatio; if(mode==='portrait') target=9/16; else if(mode==='square') target=1;
  let sx=0,sy=0,sw=vw,sh=vh; const sr=vw/vh;
  if(sr>target){ sw=Math.round(vh*target); sx=Math.round((vw-sw)/2); }
  else if(sr<target){ sh=Math.round(vw/target); sy=Math.round((vh-sh)/2); }
  if(cv.width!==sw||cv.height!==sh){ cv.width=sw; cv.height=sh; }
  ctx.save();
  if(flipped){ ctx.translate(sw,0); ctx.scale(-1,1); }
  ctx.drawImage(vid, sx,sy,sw,sh, 0,0,sw,sh);
  ctx.restore();
  processPixels(sw,sh);
  raf=requestAnimationFrame(loop);
}
function clamp(v){ return v<0?0:v>255?255:v; }
function processPixels(w,h){
  const bright=gv('fb'),contrast=gv('fc'),sat=gv('fs'),warm=gv('fw'),smooth=gv('fk'),sharp=gv('fsh');
  if(bright===0&&contrast===0&&sat===0&&warm===0&&smooth===0&&sharp===0) return;
  const imgd=ctx.getImageData(0,0,w,h), d=imgd.data;
  const cF=(259*(contrast+255))/(255*(259-contrast)), sF=(sat+100)/100;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    r=clamp(r+bright);g=clamp(g+bright);b=clamp(b+bright);
    r=clamp(cF*(r-128)+128);g=clamp(cF*(g-128)+128);b=clamp(cF*(b-128)+128);
    const gray=0.299*r+0.587*g+0.114*b;
    r=clamp(gray+(r-gray)*sF);g=clamp(gray+(g-gray)*sF);b=clamp(gray+(b-gray)*sF);
    r=clamp(r+warm*1.2);b=clamp(b-warm*1.0);
    d[i]=r;d[i+1]=g;d[i+2]=b;
  }
  if(smooth>0) boxBlur(d,w,h,smooth);
  if(sharp>0){
    const bl=new Uint8ClampedArray(d.length); for(let i=0;i<d.length;i++) bl[i]=d[i];
    boxBlur(bl,w,h,1); const amt=sharp/50;
    for(let i=0;i<d.length;i+=4){
      d[i]=clamp(d[i]+amt*(d[i]-bl[i]));
      d[i+1]=clamp(d[i+1]+amt*(d[i+1]-bl[i+1]));
      d[i+2]=clamp(d[i+2]+amt*(d[i+2]-bl[i+2]));
    }
  }
  ctx.putImageData(imgd,0,0);
}
function boxBlur(d,w,h,r){
  const tmp=new Uint8ClampedArray(d.length);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let sr=0,sg=0,sb=0,cnt=0;
    for(let dx=-r;dx<=r;dx++){ const nx=x+dx; if(nx>=0&&nx<w){ const idx=(y*w+nx)*4; sr+=d[idx];sg+=d[idx+1];sb+=d[idx+2];cnt++; } }
    const i=(y*w+x)*4; tmp[i]=sr/cnt;tmp[i+1]=sg/cnt;tmp[i+2]=sb/cnt;tmp[i+3]=d[i+3];
  }
  for(let i=0;i<d.length;i++) d[i]=tmp[i];
}

let boothShots=[], boothFrame='silver', boothBusy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function cellSnapshot(){ const c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height; c.getContext('2d').drawImage(cv,0,0); return c; }
async function startBooth(){
  if(!stream||boothBusy) return; boothBusy=true;

const FRAMES={
  silver:{bg:['#f3f5fa','#cdd3de','#a7aebd'], ink:'#2a2f3a', sub:'#6b7180'},
  holo:{bg:['#ffd1e8','#cdbcff','#bfeaff','#c6ffe0','#fff3bf'], ink:'#3a2f4a', sub:'#6a5a7a'},
  onyx:{bg:['#2a2e3a','#15171f','#0b0c10'], ink:'#f1f3fa', sub:'#9aa0ad'}
};
function roundRectPath(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawCover(c,img,x,y,w,h){
  const ir=img.width/img.height, r=w/h; let sw,sh,sx,sy;
  if(ir>r){ sh=img.height; sw=sh*r; sx=(img.width-sw)/2; sy=0; } else { sw=img.width; sh=sw/r; sx=0; sy=(img.height-sh)/2; }
  c.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
async function renderStrip(){
  if(!boothShots.length) return;
  await (document.fonts?document.fonts.ready:Promise.resolve());
  const F=FRAMES[boothFrame], S=2;
  const W=520, pad=30, gap=16, header=70, footer=84;
  const cellW=W-pad*2;
  const ref=boothShots[0]; const cellH=Math.round(cellW*(ref.height/ref.width));
  const H=pad+header+4*cellH+3*gap+footer;
  const strip=document.getElementById('strip');
  strip.width=W*S; strip.height=H*S;
  const c=strip.getContext('2d'); c.scale(S,S);
  // background
  const g=c.createLinearGradient(0,0,W,H); const stops=F.bg;
  stops.forEach((col,i)=>g.addColorStop(i/(stops.length-1), col));
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // subtle sheen
  const sh=c.createLinearGradient(0,0,W,0); sh.addColorStop(0,'rgba(255,255,255,.25)'); sh.addColorStop(.5,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(255,255,255,.18)');
  c.fillStyle=sh; c.fillRect(0,0,W,H);
  // header
  c.textAlign='center'; c.fillStyle=F.ink;
  c.font='700 26px "Chakra Petch", system-ui'; c.fillText('CompyMirror', W/2, pad+30);
  c.fillStyle=F.sub; c.font='500 11px "Chakra Petch", system-ui';
  c.fillText('L I F E   F O U R   C U T S', W/2, pad+50);
  // cells
  let y=pad+header;
  for(let i=0;i<4;i++){
    const x=pad;
    c.save(); roundRectPath(c,x,y,cellW,cellH,10); c.clip();
    if(boothShots[i]) drawCover(c, boothShots[i], x,y,cellW,cellH);
    c.restore();
    c.strokeStyle='rgba(0,0,0,.12)'; c.lineWidth=1; roundRectPath(c,x+.5,y+.5,cellW-1,cellH-1,10); c.stroke();
    y+=cellH+gap;
  }
  // footer
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  c.textAlign='center'; c.fillStyle=F.ink; c.font='600 15px "Chakra Petch", system-ui';
  c.fillText(`${n.getFullYear()}. ${p(n.getMonth()+1)}. ${p(n.getDate())}`, W/2, H-footer+44);
  c.fillStyle=F.sub; c.font='500 11px "Chakra Petch", system-ui';
  c.fillText('⟡  shot locally  ⟡', W/2, H-footer+64);
}

function resetEnhanceBtn(btn){
  if(!btn) return;
  delete btn.dataset.done; btn.disabled=false;
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/></svg> 화질 향상';
}
function withTimeout(p,ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }
function dataUrlToCanvas(url){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); res(c); }; img.onerror=rej; img.src=url; });
}
/* A — in-browser AI super-resolution (UpscalerJS / ESRGAN, WebGPU when available) */
async function aiUpscale(canvas){
  const mod=await import('https://esm.sh/upscaler@1.0.0-beta.19?bundle');
  const Upscaler=mod.default||mod.Upscaler||mod;
  const up=new Upscaler();
  const out=await up.upscale(canvas.toDataURL('image/png'), {output:'base64'});
  return await dataUrlToCanvas(out);
}
/* B — local detail enhancement: 2x resample + unsharp mask + mild contrast */
function localEnhance(src){
  const S=2, w=src.width, h=src.height;
  const out=document.createElement('canvas'); out.width=w*S; out.height=h*S;
  const o=out.getContext('2d'); o.imageSmoothingEnabled=true; o.imageSmoothingQuality='high';
  o.drawImage(src,0,0,out.width,out.height);
  const id=o.getImageData(0,0,out.width,out.height), d=id.data;
  const bl=new Uint8ClampedArray(d); boxBlur(bl,out.width,out.height,2);
  const amt=0.9;
  for(let i=0;i<d.length;i+=4){
    for(let k=0;k<3;k++){
      let v=d[i+k]+amt*(d[i+k]-bl[i+k]);
      v=(v-128)*1.07+128;
      d[i+k]=v<0?0:v>255?255:v;
    }
  }
  o.putImageData(id,0,0);
  return out;
}
async function enhance(canvas, btn){
  if(btn.dataset.done||btn.disabled) return;
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 향상 중…';
  toast('기기 안에서 화질을 향상하는 중… (잠시만요)', 4000);
  let result=null, method='';
  try{
    result=await withTimeout(aiUpscale(canvas), 28000); method='AI';
  }catch(e){
    try{ result=localEnhance(canvas); method='B'; }catch(e2){ result=null; }
  }
  if(!result){ resetEnhanceBtn(btn); toast('화질 향상에 실패했어요'); return; }
  canvas.width=result.width; canvas.height=result.height;
  canvas.getContext('2d').drawImage(result,0,0);
  btn.dataset.done='1'; btn.disabled=false; btn.innerHTML='✓ 향상됨';
  toast(method==='AI' ? 'AI 화질 향상 완료 ✨' : '디테일 보정 완료 ✨ (AI 미지원 환경 → 자동 보정)', 3400);
}

/* ═══════════════════ first-run coachmark tour ═══════════════════ */
const GUIDE_KEY='compymirror_guide_seen';
const TOUR_STEPS=[
  { sel:'#bs', place:'bottom', title:'카메라 켜기 & 프라이버시',
    body:'누르면 권한을 물어봐요 — <b>허용</b>하면 켜집니다. 영상·AI 모두 <b>이 기기 안에서만</b> 처리되고 업로드되지 않아요.' },
  { sel:'#bmode', place:'bottom', title:'비율 전환',
    body:'버튼 하나로 <b>원본 → 9:16 → 1:1</b> 순환. 찍기 전에 맞춰두세요.' },
  { sel:'#bbooth', place:'bottom', title:'인생네컷',
    body:'3초 카운트로 <b>4컷</b>이 자동 촬영돼요. 끝나면 프레임을 골라 저장·공유.' },
  { sel:'#bsnap', place:'bottom', title:'찍은 뒤',
    body:'미리보기에서 <b>저장 · 공유 · 화질 향상</b>(기기 안 AI 업스케일)을 할 수 있어요.' },
  { sel:'.presets', place:'left', title:'프리셋 & 세부 조절',
    body:'분위기를 한 번에. 아래 슬라이더로 밝기·피부보정·선명도까지 미세 조정도 돼요.' }
];
let tourIdx=0;
const tourEl=document.getElementById('tour');
const spotEl=document.getElementById('spot');
const tipEl=document.getElementById('tour-tip');

function buildDots(){
  const d=document.getElementById('tip-dots'); d.innerHTML='';
  TOUR_STEPS.forEach((_,i)=>{ const s=document.createElement('span'); if(i===tourIdx) s.className='on'; d.appendChild(s); });
}
function startTour(){
  tourIdx=0;
  document.body.classList.add('tour-live');
  document.getElementById('tip-total').textContent=String(TOUR_STEPS.length).padStart(2,'0');
  tourEl.classList.add('on'); tourEl.setAttribute('aria-hidden','false');
  buildDots();
  setTimeout(()=>showStep(0), 30);
}
function endTour(){
  tourEl.classList.remove('on'); tourEl.setAttribute('aria-hidden','true');
  document.body.classList.remove('tour-live');
  try{ localStorage.setItem(GUIDE_KEY,'1'); }catch(e){}
}
function tourNext(){ if(tourIdx>=TOUR_STEPS.length-1){ endTour(); return; } showStep(tourIdx+1); }
function tourPrev(){ if(tourIdx>0) showStep(tourIdx-1); }
// `?` button entry point
function openGuide(){ startTour(); }

function scrollToTarget(el){
  const r=el.getBoundingClientRect();
  const absCenter=r.top+window.scrollY+r.height/2;
  const want=innerHeight*0.36;            // park target in the upper band, clear of the fixed card
  window.scrollTo({top:Math.max(0, absCenter-want), behavior:'auto'});
}
function placeStep(){
  // only the spotlight moves — the tooltip card stays pinned bottom-center
  const step=TOUR_STEPS[tourIdx];
  const el=document.querySelector(step.sel);
  if(!el){ return; }
  const r=el.getBoundingClientRect();
  const pad=8;
  spotEl.style.left=(r.left-pad)+'px';
  spotEl.style.top=(r.top-pad)+'px';
  spotEl.style.width=(r.width+pad*2)+'px';
  spotEl.style.height=(r.height+pad*2)+'px';
}
function showStep(i){
  tourIdx=i;
  const step=TOUR_STEPS[i];
  document.getElementById('tip-n').textContent=String(i+1).padStart(2,'0');
  document.getElementById('tip-title').textContent=step.title;
  document.getElementById('tip-body').innerHTML=step.body;
  document.getElementById('tip-prev').hidden = (i===0);
  document.getElementById('tip-next').textContent = (i===TOUR_STEPS.length-1) ? '시작하기' : '다음';
  buildDots();
  const el=document.querySelector(step.sel);
  if(el) scrollToTarget(el);
  setTimeout(placeStep, 40);
}
// keep aligned on resize/scroll while active
let realignT=null;
['resize','scroll'].forEach(ev=>window.addEventListener(ev,()=>{
  if(!tourEl.classList.contains('on')) return;
  clearTimeout(realignT); realignT=setTimeout(placeStep,60);
},{passive:true}));
document.addEventListener('keydown',(e)=>{
  if(!tourEl.classList.contains('on')) return;
  if(e.key==='Escape') endTour();
  else if(e.key==='ArrowRight') tourNext();
  else if(e.key==='ArrowLeft') tourPrev();
});
// show automatically on first visit
try{ if(!localStorage.getItem(GUIDE_KEY)) setTimeout(startTour, 600); }catch(e){ setTimeout(startTour,600); }

/* ═══════════════════ init ═══════════════════ */
loadFilters();
paintChips();
navigator.mediaDevices?.enumerateDevices?.().then(listCameras).catch(()=>{});
</script>
<script src="micro.js"></script>
