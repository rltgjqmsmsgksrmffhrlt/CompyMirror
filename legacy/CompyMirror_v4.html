<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CompyMirror</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" />

<style>
/* ── tokens ────────────────────────────────────────────────────────────── */
:root{
  --bg:           #f4f0e9;
  --card:         #fbf8f2;
  --card-2:       #ffffff;
  --ink:          #1a1714;
  --ink-2:        #4d4740;
  --ink-3:        #8a8278;
  --ink-4:        #b8b0a3;
  --line:         rgba(26,23,20,.09);
  --line-2:       rgba(26,23,20,.05);
  --accent:       oklch(56% 0.10 38);   /* clay */
  --accent-soft:  oklch(93% 0.022 40);
  --accent-ink:   oklch(38% 0.07 38);
  --good:         oklch(48% 0.05 145);
  --good-soft:    oklch(95% 0.018 145);
  --shadow-sm:    0 1px 0 rgba(26,23,20,.04), 0 2px 6px rgba(26,23,20,.03);
  --shadow-md:    0 1px 0 rgba(26,23,20,.04), 0 8px 24px -8px rgba(26,23,20,.10);
  --radius:       14px;
  --radius-sm:    10px;
  --radius-lg:    18px;
  --font-sans:    "Pretendard Variable","Pretendard",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-serif:   "Fraunces",ui-serif,Georgia,serif;
}

/* theme: paper (cleaner) */
html[data-theme="paper"]{
  --bg:#ffffff; --card:#fafafa; --card-2:#ffffff;
  --ink:#0e0e0e; --ink-2:#444; --ink-3:#8a8a8a; --ink-4:#c4c4c4;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.05);
}
/* theme: studio (dark) */
html[data-theme="studio"]{
  --bg:#171513; --card:#211e1b; --card-2:#27231f;
  --ink:#f1ece4; --ink-2:#c8c0b3; --ink-3:#8a8276; --ink-4:#5a544b;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.04);
  --accent-soft:oklch(32% 0.06 38); --accent-ink:oklch(85% 0.08 38);
  --good-soft:oklch(28% 0.04 145);
  --shadow-md: 0 1px 0 rgba(0,0,0,.4), 0 12px 30px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-feature-settings:"ss01","ss03","cv11";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100vh;padding:36px 28px 64px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}

/* ── shell ─────────────────────────────────────────────────────────────── */
.shell{max-width:1180px;margin:0 auto}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand-mark{font-family:var(--font-serif);font-weight:300;font-size:28px;letter-spacing:-.02em;color:var(--ink);font-style:italic}
.brand-mark em{font-style:normal;font-weight:400;color:var(--accent)}
.brand-tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.brand-tag::before{content:"";display:inline-block;width:14px;height:1px;background:var(--ink-4);vertical-align:middle;margin-right:8px}

.privacy{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;background:var(--good-soft);color:var(--good);border-radius:999px;font-size:12px;font-weight:500;letter-spacing:-.005em;white-space:nowrap}
.privacy svg{width:13px;height:13px;flex:0 0 13px}
.privacy b{font-weight:600;margin-right:2px}

/* ── layout grid ───────────────────────────────────────────────────────── */
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.85fr);gap:22px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:1fr}}

/* ── stage (viewfinder side) ───────────────────────────────────────────── */
.stage{display:flex;flex-direction:column;gap:14px}
.viewfinder{position:relative;width:100%;background:#0c0a09;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);aspect-ratio:var(--vf-ratio,4/3);transition:aspect-ratio .35s cubic-bezier(.4,0,.2,1),max-width .35s cubic-bezier(.4,0,.2,1);margin-inline:auto;align-self:center}
/* cap width so derived height stays under ~78vh */
.viewfinder[data-mode="portrait"]{max-width:calc(78vh * 9 / 16)}
.viewfinder[data-mode="square"]{max-width:78vh}
.viewfinder::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none}

#vid{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cv{display:none;position:absolute;inset:0;width:100%;height:100%}

.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#67625b;text-align:center}
.ph-disc{width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35)}
.ph-disc svg{width:26px;height:26px}
.ph-text{font-size:13px;color:rgba(255,255,255,.45);letter-spacing:-.005em}
.ph-text small{display:block;font-size:11px;color:rgba(255,255,255,.25);margin-top:4px}

#countdown{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-serif);font-weight:300;font-size:140px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6);z-index:10;line-height:1;pointer-events:none;font-feature-settings:"tnum"}

.vf-corner{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);color:rgba(255,255,255,.85);font-size:11px;font-weight:500;letter-spacing:.02em;opacity:0;transition:opacity .2s}
.vf-corner.on{opacity:1}
.vf-corner .dot{width:6px;height:6px;border-radius:50%;background:#e25c4a;box-shadow:0 0 0 0 rgba(226,92,74,.5);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,92,74,.55)}70%{box-shadow:0 0 0 8px rgba(226,92,74,0)}100%{box-shadow:0 0 0 0 rgba(226,92,74,0)}}

/* control row beneath viewfinder */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.controls .spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;letter-spacing:-.005em;background:var(--card);border:1px solid var(--line);color:var(--ink-2);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--card-2);border-color:var(--ink-4);color:var(--ink)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff8ed}
.btn.primary:hover{background:#000;border-color:#000;color:#fff}
.btn.icon-only{padding:0;width:38px;justify-content:center}
.btn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.btn.danger{color:#a13e2c}
.btn.ghost{background:transparent}

.cam-select{display:none;align-items:center;gap:8px;padding:0 4px 0 14px;height:36px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.cam-select.on{display:inline-flex}
.cam-select select{appearance:none;background:transparent;border:none;outline:none;font:inherit;color:var(--ink-2);padding:0 24px 0 4px;max-width:160px;cursor:pointer}
.cam-select::after{content:"⌄";color:var(--ink-3);margin-left:-20px;pointer-events:none;font-size:14px;transform:translateY(-2px)}

.timer-row{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.timer-row.on{display:flex}
.timer-row .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.tb{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--ink-2);transition:all .15s;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb:hover{border-color:var(--ink-4);color:var(--ink)}

/* ── panel (filters) ───────────────────────────────────────────────────── */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel + .panel{margin-top:14px}
.panel-hd{display:flex;align-items:baseline;justify-content:space-between;padding:18px 20px 12px}
.panel-hd h2{font-family:var(--font-serif);font-weight:300;font-size:17px;font-style:italic;letter-spacing:-.01em;color:var(--ink)}
.panel-hd .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);font-weight:500}
.panel-bd{padding:6px 20px 18px}

/* presets */
.presets{display:flex;flex-wrap:wrap;gap:6px}
.pb{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:500;background:transparent;border:1px solid var(--line);color:var(--ink-2);transition:all .15s;letter-spacing:-.005em;white-space:nowrap}
.pb:hover{border-color:var(--ink-4);color:var(--ink)}
.pb.on{background:var(--ink);border-color:var(--ink);color:#fff8ed}

/* sliders */
.row{display:grid;grid-template-columns:64px 1fr 38px;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line-2)}
.row:first-child{border-top:none}
.row .name{font-size:12.5px;color:var(--ink-2);letter-spacing:-.005em}
.row .val{font-family:var(--font-serif);font-weight:400;font-size:15px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.row.zero .val{color:var(--ink-4)}

input[type=range]{
  -webkit-appearance:none;appearance:none;background:transparent;width:100%;height:18px;cursor:pointer;outline:none;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--card-2);border:1px solid var(--ink);margin-top:-6px;transition:transform .12s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--card-2);border:1px solid var(--ink);transition:transform .12s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:hover::-moz-range-thumb{transform:scale(1.15)}
input[type=range]:active::-webkit-slider-thumb{background:var(--ink)}
input[type=range]:active::-moz-range-thumb{background:var(--ink)}

/* reset link */
.panel-foot{display:flex;justify-content:flex-end;padding:0 20px 16px}
.linkbtn{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;background:none;border:none;cursor:pointer;padding:4px 0}
.linkbtn:hover{color:var(--ink)}
.linkbtn::before{content:"↺";margin-right:5px;font-size:13px;display:inline-block;transform:translateY(.5px)}

/* ── snapshot drawer ───────────────────────────────────────────────────── */
.snap{display:none;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.snap.on{display:block}
.snap-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.snap-hd .left{display:flex;align-items:baseline;gap:10px}
.snap-hd h3{font-family:var(--font-serif);font-style:italic;font-weight:300;font-size:16px;color:var(--ink)}
.snap-hd .when{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.snap-img-wrap{padding:0 18px 18px}
#sc{display:block;width:100%;border-radius:10px;border:1px solid var(--line)}

/* ── tweaks panel ──────────────────────────────────────────────────────── */
#tweaks{display:none;position:fixed;right:20px;bottom:20px;width:280px;background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 20px 50px -10px rgba(0,0,0,.18);z-index:1000;overflow:hidden}
#tweaks.on{display:block}
.tw-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.tw-hd h4{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:15px}
.tw-close{width:24px;height:24px;border-radius:6px;color:var(--ink-3)}
.tw-close:hover{background:var(--line-2);color:var(--ink)}
.tw-bd{padding:14px 16px 18px}
.tw-row + .tw-row{margin-top:14px}
.tw-row .tw-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:500}
.tw-opts{display:flex;gap:6px;flex-wrap:wrap}
.tw-opt{flex:1;min-width:0;height:32px;padding:0 10px;border-radius:8px;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--ink-2);text-align:center;white-space:nowrap}
.tw-opt.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tw-swatches{display:flex;gap:8px}
.tw-sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .12s;position:relative}
.tw-sw:hover{transform:scale(1.08)}
.tw-sw.on{border-color:var(--ink)}
.tw-sw::after{content:attr(data-name);position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);font-size:10px;color:var(--ink-3);white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none}
.tw-sw:hover::after{opacity:1}

/* ── responsive trims ──────────────────────────────────────────────────── */
@media (max-width:600px){
  body{padding:22px 16px 56px}
  .brand-tag{display:none}
  .brand-mark{font-size:24px}
  .privacy{font-size:11px}
  .panel-hd{padding:16px 16px 10px}
  .panel-bd{padding:6px 16px 16px}
  #countdown{font-size:96px}
}
</style>
</head>
<body>

<div class="shell">

  <header class="brandrow">
    <div class="brand">
      <span class="brand-mark"><em>C</em>ompy<em>M</em>irror</span>
      <span class="brand-tag">Local mirror &amp; light retouch</span>
    </div>
    <div class="privacy" title="이 앱의 모든 영상 처리는 브라우저에서만 일어납니다">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      <span><b>로컬 전용</b>· 영상은 외부로 전송되지 않습니다</span>
    </div>
  </header>

  <main class="grid">

    <!-- stage column -->
    <section class="stage">
      <div id="viewfinder" class="viewfinder" data-mode="auto">
        <div class="ph" id="ph">
          <div class="ph-disc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
          </div>
          <div class="ph-text">카메라가 꺼져 있습니다<small>아래 “카메라 시작”을 눌러 거울을 켜세요</small></div>
        </div>
        <video id="vid" autoplay playsinline muted></video>
        <canvas id="cv"></canvas>
        <div id="countdown"></div>
        <div class="vf-corner" id="rec"><span class="dot"></span><span>LIVE</span></div>
      </div>

      <!-- controls -->
      <div class="controls">
        <button id="bs" class="btn primary" onclick="startCam()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          카메라 시작
        </button>
        <button id="bx" class="btn ghost danger" onclick="stopCam()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l3-3h6"/><path d="M9 13a3 3 0 1 0 5.12 2.12"/></svg>
          끄기
        </button>
        <button id="bf" class="btn" onclick="toggleFlip()" style="display:none" title="좌우 반전">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 7 7 7 7 3"/><line x1="7" y1="7" x2="3" y2="11"/><polyline points="21 17 17 17 17 21"/><line x1="17" y1="17" x2="21" y2="13"/><path d="M12 3v18"/></svg>
          반전
        </button>
        <button id="bmode" class="btn" onclick="cycleMode()" style="display:none" title="비율 전환 (원본 → 9:16 → 1:1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
          <span id="bmode-lbl">원본</span>
        </button>
        <div class="cam-select" id="cam-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <select id="cam-sel" onchange="switchCam()"></select>
        </div>
        <div class="spacer"></div>
        <button id="bsnap" class="btn primary" onclick="snap()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
          스냅샷
        </button>
      </div>

      <div class="timer-row" id="timer-btns">
        <span class="lbl">셀프 타이머</span>
        <button class="tb" onclick="timedSnap(3)">3s</button>
        <button class="tb" onclick="timedSnap(5)">5s</button>
        <button class="tb" onclick="timedSnap(10)">10s</button>
      </div>

      <!-- snapshot drawer -->
      <div id="snapbox" class="snap">
        <div class="snap-hd">
          <div class="left">
            <h3>방금 찍은 한 장</h3>
            <span class="when" id="snap-when"></span>
          </div>
          <button class="btn" onclick="downloadSnap()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            PNG 저장
          </button>
        </div>
        <div class="snap-img-wrap"><canvas id="sc"></canvas></div>
      </div>
    </section>

    <!-- side panel column -->
    <aside>
      <section class="panel">
        <div class="panel-hd">
          <h2>Preset</h2>
          <span class="kicker">프리셋</span>
        </div>
        <div class="panel-bd">
          <div class="presets">
            <button class="pb on" data-name="off" onclick="preset('off',this)">없음</button>
            <button class="pb" data-name="natural" onclick="preset('natural',this)">내추럴</button>
            <button class="pb" data-name="glow" onclick="preset('glow',this)">글로우</button>
            <button class="pb" data-name="vivid" onclick="preset('vivid',this)">비비드</button>
            <button class="pb" data-name="mono" onclick="preset('mono',this)">흑백</button>
            <button class="pb" data-name="warm" onclick="preset('warm',this)">웜톤</button>
            <button class="pb" data-name="cool" onclick="preset('cool',this)">쿨톤</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-hd">
          <h2>Adjust</h2>
          <span class="kicker">세부 조절</span>
        </div>
        <div class="panel-bd">
          <div class="row"><span class="name">밝기</span><input type="range" id="fb" min="-100" max="100" step="1" value="0" oninput="sv('fb','vb')"><span class="val" id="vb">0</span></div>
          <div class="row"><span class="name">대비</span><input type="range" id="fc" min="-100" max="100" step="1" value="0" oninput="sv('fc','vc')"><span class="val" id="vc">0</span></div>
          <div class="row"><span class="name">채도</span><input type="range" id="fs" min="-100" max="100" step="1" value="0" oninput="sv('fs','vs')"><span class="val" id="vs">0</span></div>
          <div class="row"><span class="name">따뜻함</span><input type="range" id="fw" min="-80" max="80" step="1" value="0" oninput="sv('fw','vw')"><span class="val" id="vw">0</span></div>
          <div class="row"><span class="name">피부보정</span><input type="range" id="fk" min="0" max="8" step="1" value="0" oninput="sv('fk','vk')"><span class="val" id="vk">0</span></div>
          <div class="row"><span class="name">선명도</span><input type="range" id="fsh" min="0" max="100" step="1" value="0" oninput="sv('fsh','vsh')"><span class="val" id="vsh">0</span></div>
        </div>
        <div class="panel-foot">
          <button class="linkbtn" onclick="resetAll()">전체 초기화</button>
        </div>
      </section>
    </aside>

  </main>
</div>

<!-- ── tweaks panel ──────────────────────────────────────────────────── -->
<div id="tweaks">
  <div class="tw-hd">
    <h4>Tweaks</h4>
    <button class="tw-close" onclick="closeTweaks()" aria-label="닫기">✕</button>
  </div>
  <div class="tw-bd">
    <div class="tw-row">
      <div class="tw-label">Theme</div>
      <div class="tw-opts" id="tw-theme">
        <button class="tw-opt" data-v="ivory">Ivory</button>
        <button class="tw-opt" data-v="paper">Paper</button>
        <button class="tw-opt" data-v="studio">Studio</button>
      </div>
    </div>
    <div class="tw-row">
      <div class="tw-label">Accent</div>
      <div class="tw-swatches" id="tw-accent">
        <button class="tw-sw" data-v="clay"  data-name="Clay"  style="background:oklch(56% 0.10 38)"></button>
        <button class="tw-sw" data-v="sage"  data-name="Sage"  style="background:oklch(56% 0.07 145)"></button>
        <button class="tw-sw" data-v="plum"  data-name="Plum"  style="background:oklch(48% 0.08 340)"></button>
        <button class="tw-sw" data-v="slate" data-name="Slate" style="background:oklch(50% 0.04 250)"></button>
      </div>
    </div>
  </div>
</div>

<script>
/* ───────────────────────────────────────────────────────────────────────
   Tweaks (theme + accent) — defaults persisted via host postMessage
   ─────────────────────────────────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "ivory",
  "accent": "clay"
}/*EDITMODE-END*/;

const ACCENTS = {
  clay:  { a:"oklch(56% 0.10 38)",  soft:"oklch(93% 0.022 40)",  ink:"oklch(38% 0.07 38)"  },
  sage:  { a:"oklch(56% 0.07 145)", soft:"oklch(94% 0.018 145)", ink:"oklch(36% 0.05 145)" },
  plum:  { a:"oklch(48% 0.08 340)", soft:"oklch(94% 0.02 340)",  ink:"oklch(34% 0.06 340)" },
  slate: { a:"oklch(50% 0.04 250)", soft:"oklch(94% 0.012 250)", ink:"oklch(32% 0.03 250)" }
};

let tweaks = {...TWEAK_DEFAULTS};

function applyTweaks() {
  document.documentElement.dataset.theme = tweaks.theme === "ivory" ? "" : tweaks.theme;
  const acc = ACCENTS[tweaks.accent] || ACCENTS.clay;
  document.documentElement.style.setProperty("--accent", acc.a);
  if (tweaks.theme !== "studio") {
    document.documentElement.style.setProperty("--accent-soft", acc.soft);
    document.documentElement.style.setProperty("--accent-ink",  acc.ink);
  }
  // sync UI state
  document.querySelectorAll("#tw-theme .tw-opt").forEach(b => b.classList.toggle("on", b.dataset.v === tweaks.theme));
  document.querySelectorAll("#tw-accent .tw-sw").forEach(b => b.classList.toggle("on", b.dataset.v === tweaks.accent));
}

function setTweak(key, value) {
  tweaks[key] = value;
  applyTweaks();
  try { window.parent.postMessage({type:"__edit_mode_set_keys", edits:{[key]:value}}, "*"); } catch(e){}
}

document.querySelectorAll("#tw-theme .tw-opt").forEach(b => b.addEventListener("click", () => setTweak("theme", b.dataset.v)));
document.querySelectorAll("#tw-accent .tw-sw").forEach(b => b.addEventListener("click", () => setTweak("accent", b.dataset.v)));

window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "__activate_edit_mode") document.getElementById("tweaks").classList.add("on");
  if (d.type === "__deactivate_edit_mode") document.getElementById("tweaks").classList.remove("on");
});
function closeTweaks(){
  document.getElementById("tweaks").classList.remove("on");
  try { window.parent.postMessage({type:"__edit_mode_dismissed"}, "*"); } catch(e){}
}
// announce
setTimeout(() => { try { window.parent.postMessage({type:"__edit_mode_available"}, "*"); } catch(e){} }, 50);

applyTweaks();

/* ───────────────────────────────────────────────────────────────────────
   Camera + filter logic (preserved from v3, with small UI hooks)
   ─────────────────────────────────────────────────────────────────────── */
const LS_KEY = "compymirror_v4";
let stream = null, flipped = true, raf = null, timerRaf = null;
let mode = "auto";        // 'auto' | 'portrait' | 'square'
let camRatio = 4/3;       // detected from camera once it starts
const vid = document.getElementById("vid");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d", { willReadFrequently:true });

function saveFilters() {
  const vals = ["fb","fc","fs","fw","fk","fsh"].reduce((o,id) => { o[id] = +document.getElementById(id).value; return o; }, {});
  try { localStorage.setItem(LS_KEY, JSON.stringify(vals)); } catch(e) {}
}
function loadFilters() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    ["fb","fc","fs","fw","fk","fsh"].forEach(id => {
      if (saved[id] !== undefined) {
        document.getElementById(id).value = saved[id];
        const dispId = "v" + id.slice(1);
        document.getElementById(dispId).textContent = saved[id];
      }
    });
    updateZeroStates();
  } catch(e) {}
}
function updateZeroStates(){
  ["fb","fc","fs","fw","fk","fsh"].forEach(id => {
    const r = document.getElementById(id);
    r.closest(".row").classList.toggle("zero", +r.value === 0);
  });
}
function gv(id) { return parseInt(document.getElementById(id).value); }
function sv(sid, vid2) {
  document.getElementById(vid2).textContent = document.getElementById(sid).value;
  document.querySelectorAll(".pb").forEach(b => b.classList.remove("on"));
  updateZeroStates();
  saveFilters();
}
function setSliders(b, c, s, w, k, sh) {
  const vals = {fb:b, fc:c, fs:s, fw:w, fk:k, fsh:sh};
  const disp = {vb:b, vc:c, vs:s, vw:w, vk:k, vsh:sh};
  Object.entries(vals).forEach(([id, v]) => document.getElementById(id).value = v);
  Object.entries(disp).forEach(([id, v]) => document.getElementById(id).textContent = v);
  updateZeroStates();
  saveFilters();
}
function resetAll(){
  document.querySelectorAll(".pb").forEach(b => b.classList.remove("on"));
  document.querySelector('.pb[data-name="off"]').classList.add("on");
  setSliders(0,0,0,0,0,0);
}

const presets = {
  off:     [0,  0,    0,   0, 0, 0],
  natural: [15, 5,   10,  15, 2, 10],
  glow:    [35, -15,  5,  20, 4, 0],
  vivid:   [5,  40,  70,   0, 1, 20],
  mono:    [0,  20, -100,  0, 1, 5],
  warm:    [10, 10,  20,  60, 2, 5],
  cool:    [5,  10,  10, -60, 2, 5]
};

function preset(name, btn) {
  document.querySelectorAll(".pb").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  const [b, c, s, w, k, sh] = presets[name];
  setSliders(b, c, s, w, k, sh);
}

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === "videoinput");
    const sel = document.getElementById("cam-sel");
    sel.innerHTML = "";
    cams.forEach((cam, i) => {
      const opt = document.createElement("option");
      opt.value = cam.deviceId;
      opt.textContent = cam.label || `카메라 ${i + 1}`;
      sel.appendChild(opt);
    });
    document.getElementById("cam-row").classList.toggle("on", cams.length > 1);
  } catch(e) {}
}

async function startCam() {
  try {
    const deviceId = document.getElementById("cam-sel").value;
    const constraints = {
      video: {
        width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "user",
        ...(deviceId ? { deviceId: { exact: deviceId } } : {})
      },
      audio: false
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    vid.srcObject = stream;
    await vid.play();
    await listCameras();
    document.getElementById("ph").style.display = "none";
    cv.style.display = "block";
    document.getElementById("bs").style.display = "none";
    ["bx","bf","bmode","bsnap"].forEach(id => document.getElementById(id).style.display = "");
    document.getElementById("timer-btns").classList.add("on");
    document.getElementById("rec").classList.add("on");
    // detect camera native ratio for auto mode
    camRatio = (vid.videoWidth || 4) / (vid.videoHeight || 3);
    applyMode();
    updateFlipBtn();
    loop();
  } catch(e) {
    alert("카메라 오류: " + e.message);
  }
}

async function switchCam() {
  if (!stream) return;
  stopStream();
  await startCam();
}

function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  cancelAnimationFrame(raf);
  if (timerRaf) { clearTimeout(timerRaf); timerRaf = null; }
}

function stopCam() {
  stopStream();
  cv.style.display = "none";
  document.getElementById("ph").style.display = "flex";
  document.getElementById("bs").style.display = "";
  document.getElementById("cam-row").classList.remove("on");
  document.getElementById("timer-btns").classList.remove("on");
  document.getElementById("rec").classList.remove("on");
  ["bx","bf","bmode","bsnap"].forEach(id => document.getElementById(id).style.display = "none");
  document.getElementById("countdown").style.display = "none";
}

window.addEventListener("beforeunload", stopStream);

function toggleFlip() { flipped = !flipped; updateFlipBtn(); }
function updateFlipBtn() {
  document.getElementById("bf").classList.toggle("on", flipped);
}

const MODE_ORDER = ["auto", "portrait", "square"];
const MODE_LABEL = { auto:"원본", portrait:"9:16", square:"1:1" };
function cycleMode() {
  mode = MODE_ORDER[(MODE_ORDER.indexOf(mode) + 1) % MODE_ORDER.length];
  applyMode();
}
function applyMode() {
  const vf = document.getElementById("viewfinder");
  vf.dataset.mode = mode;
  document.getElementById("bmode-lbl").textContent = MODE_LABEL[mode];
  // set CSS aspect-ratio var
  if (mode === "auto")          vf.style.setProperty("--vf-ratio", camRatio);
  else if (mode === "portrait") vf.style.setProperty("--vf-ratio", "9/16");
  else if (mode === "square")   vf.style.setProperty("--vf-ratio", "1/1");
}

function loop() {
  if (!stream) return;
  const vw = vid.videoWidth || 640, vh = vid.videoHeight || 480;

  // update detected camera ratio + propagate to viewfinder if in auto mode
  const newRatio = vw / vh;
  if (Math.abs(newRatio - camRatio) > 0.001) {
    camRatio = newRatio;
    if (mode === "auto") {
      document.getElementById("viewfinder").style.setProperty("--vf-ratio", camRatio);
    }
  }

  // figure out target aspect for the canvas (= the displayed frame)
  let targetRatio = camRatio;
  if (mode === "portrait") targetRatio = 9/16;
  else if (mode === "square") targetRatio = 1;

  // crop source rect to match target ratio (no stretch)
  let sx=0, sy=0, sw=vw, sh=vh;
  const srcRatio = vw / vh;
  if (srcRatio > targetRatio) {
    sw = Math.round(vh * targetRatio);
    sx = Math.round((vw - sw) / 2);
  } else if (srcRatio < targetRatio) {
    sh = Math.round(vw / targetRatio);
    sy = Math.round((vh - sh) / 2);
  }

  if (cv.width !== sw || cv.height !== sh) { cv.width = sw; cv.height = sh; }
  ctx.save();
  if (flipped) { ctx.translate(sw, 0); ctx.scale(-1, 1); }
  ctx.drawImage(vid, sx, sy, sw, sh, 0, 0, sw, sh);
  ctx.restore();
  processPixels(sw, sh);
  raf = requestAnimationFrame(loop);
}

function clamp(v) { return v < 0 ? 0 : v > 255 ? 255 : v; }

function processPixels(w, h) {
  const bright = gv("fb"), contrast = gv("fc"), sat = gv("fs"),
        warm = gv("fw"), smooth = gv("fk"), sharp = gv("fsh");
  if (bright===0 && contrast===0 && sat===0 && warm===0 && smooth===0 && sharp===0) return;

  const imgd = ctx.getImageData(0, 0, w, h);
  const d = imgd.data;
  const cFactor = (259 * (contrast + 255)) / (255 * (259 - contrast));
  const sFactor = (sat + 100) / 100;

  for (let i = 0; i < d.length; i += 4) {
    let r = d[i], g = d[i+1], b = d[i+2];
    r = clamp(r + bright); g = clamp(g + bright); b = clamp(b + bright);
    r = clamp(cFactor * (r - 128) + 128);
    g = clamp(cFactor * (g - 128) + 128);
    b = clamp(cFactor * (b - 128) + 128);
    const gray = 0.299*r + 0.587*g + 0.114*b;
    r = clamp(gray + (r - gray) * sFactor);
    g = clamp(gray + (g - gray) * sFactor);
    b = clamp(gray + (b - gray) * sFactor);
    r = clamp(r + warm * 1.2); b = clamp(b - warm * 1.0);
    d[i] = r; d[i+1] = g; d[i+2] = b;
  }
  if (smooth > 0) boxBlur(d, w, h, smooth);
  if (sharp > 0) {
    const blurred = new Uint8ClampedArray(d.length);
    for (let i = 0; i < d.length; i++) blurred[i] = d[i];
    boxBlur(blurred, w, h, 1);
    const amount = sharp / 50;
    for (let i = 0; i < d.length; i += 4) {
      d[i]   = clamp(d[i]   + amount * (d[i]   - blurred[i]));
      d[i+1] = clamp(d[i+1] + amount * (d[i+1] - blurred[i+1]));
      d[i+2] = clamp(d[i+2] + amount * (d[i+2] - blurred[i+2]));
    }
  }
  ctx.putImageData(imgd, 0, 0);
}

function boxBlur(d, w, h, r) {
  const tmp = new Uint8ClampedArray(d.length);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sr=0, sg=0, sb=0, cnt=0;
      for (let dx = -r; dx <= r; dx++) {
        const nx = x + dx;
        if (nx >= 0 && nx < w) {
          const idx = (y*w + nx)*4;
          sr += d[idx]; sg += d[idx+1]; sb += d[idx+2]; cnt++;
        }
      }
      const i = (y*w + x)*4;
      tmp[i]=sr/cnt; tmp[i+1]=sg/cnt; tmp[i+2]=sb/cnt; tmp[i+3]=d[i+3];
    }
  }
  for (let i = 0; i < d.length; i++) d[i] = tmp[i];
}

function snap() {
  const sc = document.getElementById("sc");
  sc.width = cv.width; sc.height = cv.height;
  sc.getContext("2d").drawImage(cv, 0, 0);
  document.getElementById("snapbox").classList.add("on");
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  document.getElementById("snap-when").textContent = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function downloadSnap() {
  const sc = document.getElementById("sc");
  const link = document.createElement("a");
  link.download = `compymirror_${Date.now()}.png`;
  link.href = sc.toDataURL("image/png");
  link.click();
}

function timedSnap(sec) {
  if (!stream) return;
  const cd = document.getElementById("countdown");
  let remaining = sec;
  cd.style.display = "block";
  cd.textContent = remaining;
  function tick() {
    remaining--;
    if (remaining <= 0) { cd.style.display = "none"; snap(); }
    else { cd.textContent = remaining; timerRaf = setTimeout(tick, 1000); }
  }
  timerRaf = setTimeout(tick, 1000);
}

loadFilters();
navigator.mediaDevices?.enumerateDevices?.().then(listCameras).catch(()=>{});
</script>
</body>
</html>
