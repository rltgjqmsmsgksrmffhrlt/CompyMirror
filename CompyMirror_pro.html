
<h2 class="sr-only">보안 거울 앱 — 카메라 영상이 기기 밖으로 전송되지 않으며, 뷰티 필터를 조절할 수 있습니다</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{padding:1rem 0}
#security-badge{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--color-background-success);border:0.5px solid var(--color-border-success);border-radius:var(--border-radius-md);margin-bottom:1rem;font-size:13px;color:var(--color-text-success)}
#viewfinder{position:relative;width:100%;aspect-ratio:4/3;background:#111;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);overflow:hidden;margin-bottom:1rem}
#video{display:none;width:100%;height:100%;object-fit:cover}
canvas#output{display:none;width:100%;height:100%;object-fit:cover}
#placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:#888;font-size:15px}
#top-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem}
.filter-section{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem;margin-bottom:1rem;background:var(--color-background-primary)}
.filter-section h3{font-size:13px;font-weight:500;color:var(--color-text-secondary);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:var(--color-text-secondary);width:70px;flex-shrink:0}
.slider-row input[type=range]{flex:1}
.slider-row span{font-size:13px;font-weight:500;width:32px;text-align:right;color:var(--color-text-primary)}
.preset-row{display:flex;gap:8px;flex-wrap:wrap}
.preset-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);cursor:pointer;color:var(--color-text-primary)}
.preset-btn.active{background:var(--color-background-info);border-color:var(--color-border-info);color:var(--color-text-info)}
#snap-result{margin-top:1rem;display:none}
#snap-result canvas{width:100%;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary)}
</style>

<div id="app">
  <div id="security-badge">
    <i class="ti ti-shield-check" style="font-size:18px" aria-hidden="true"></i>
    <div>
      <strong>100% 로컬 처리</strong> — 카메라 영상이 서버로 전송되지 않습니다. 모든 처리는 이 브라우저 안에서만 이루어집니다.
    </div>
  </div>

  <div id="viewfinder">
    <div id="placeholder">
      <i class="ti ti-camera" style="font-size:40px" aria-hidden="true"></i>
      <span>카메라 시작 버튼을 눌러주세요</span>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>

  <div id="top-controls">
    <button id="btn-start" onclick="startCam()"><i class="ti ti-camera" aria-hidden="true"></i> 카메라 시작</button>
    <button id="btn-stop" style="display:none" onclick="stopCam()"><i class="ti ti-camera-off" aria-hidden="true"></i> 끄기</button>
    <button id="btn-flip" style="display:none" onclick="toggleFlip()"><i class="ti ti-flip-horizontal" aria-hidden="true"></i> 좌우반전</button>
    <button id="btn-snap" style="display:none" onclick="takeSnap()"><i class="ti ti-capture" aria-hidden="true"></i> 스냅샷</button>
  </div>

  <div class="filter-section">
    <h3>뷰티 필터</h3>
    <div class="preset-row" style="margin-bottom:14px">
      <button class="preset-btn active" onclick="applyPreset('none',this)">없음</button>
      <button class="preset-btn" onclick="applyPreset('natural',this)">내추럴</button>
      <button class="preset-btn" onclick="applyPreset('glow',this)">글로우</button>
      <button class="preset-btn" onclick="applyPreset('vivid',this)">비비드</button>
      <button class="preset-btn" onclick="applyPreset('mono',this)">흑백</button>
      <button class="preset-btn" onclick="applyPreset('warm',this)">웜톤</button>
      <button class="preset-btn" onclick="applyPreset('cool',this)">쿨톤</button>
    </div>

    <div class="slider-row">
      <label>밝기</label>
      <input type="range" id="s-bright" min="-100" max="100" step="1" value="0" oninput="updateFilter()">
      <span id="v-bright">0</span>
    </div>
    <div class="slider-row">
      <label>대비</label>
      <input type="range" id="s-contrast" min="-100" max="100" step="1" value="0" oninput="updateFilter()">
      <span id="v-contrast">0</span>
    </div>
    <div class="slider-row">
      <label>채도</label>
      <input type="range" id="s-sat" min="-100" max="100" step="1" value="0" oninput="updateFilter()">
      <span id="v-sat">0</span>
    </div>
    <div class="slider-row">
      <label>따뜻함</label>
      <input type="range" id="s-warm" min="-100" max="100" step="1" value="0" oninput="updateFilter()">
      <span id="v-warm">0</span>
    </div>
    <div class="slider-row">
      <label>피부보정</label>
      <input type="range" id="s-smooth" min="0" max="100" step="1" value="0" oninput="updateFilter()">
      <span id="v-smooth">0</span>
    </div>
    <div class="slider-row">
      <label>선명도</label>
      <input type="range" id="s-sharp" min="0" max="100" step="1" value="0" oninput="updateFilter()">
      <span id="v-sharp">0</span>
    </div>
  </div>

  <div id="snap-result">
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:8px"><i class="ti ti-photo" aria-hidden="true"></i> 스냅샷 — 길게 눌러서 저장하세요</p>
    <canvas id="snap-canvas"></canvas>
  </div>
</div>

<script>
let stream=null, flipped=true, animId=null;
let filters={bright:0,contrast:0,sat:0,warm:0,smooth:0,sharp:0};

const video=document.getElementById('video');
const output=document.getElementById('output');
const ctx=output.getContext('2d');

function updateFilter(){
  ['bright','contrast','sat','warm','smooth','sharp'].forEach(k=>{
    const id='s-'+k; const vid='v-'+k;
    const val=parseInt(document.getElementById(id).value);
    filters[k]=val;
    document.getElementById(vid).textContent=val;
  });
}

function applyPreset(name,btn){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const presets={
    none:{bright:0,contrast:0,sat:0,warm:0,smooth:0,sharp:0},
    natural:{bright:10,contrast:5,sat:10,warm:10,smooth:30,sharp:10},
    glow:{bright:30,contrast:-10,sat:15,warm:20,smooth:60,sharp:0},
    vivid:{bright:5,contrast:30,sat:60,warm:0,smooth:20,sharp:20},
    mono:{bright:0,contrast:20,sat:-100,warm:0,smooth:10,sharp:10},
    warm:{bright:10,contrast:5,sat:20,warm:60,smooth:25,sharp:5},
    cool:{bright:5,contrast:10,sat:10,warm:-60,smooth:20,sharp:5}
  };
  const p=presets[name];
  Object.keys(p).forEach(k=>{
    filters[k]=p[k];
    document.getElementById('s-'+k).value=p[k];
    document.getElementById('v-'+k).textContent=p[k];
  });
}

async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{width:{ideal:1920},height:{ideal:1080},facingMode:'user'},audio:false
    });
    video.srcObject=stream;
    await video.play();
    document.getElementById('placeholder').style.display='none';
    video.style.display='block';
    output.style.display='block';
    document.getElementById('btn-start').style.display='none';
    ['btn-stop','btn-flip','btn-snap'].forEach(id=>document.getElementById(id).style.display='');
    renderLoop();
  }catch(e){
    alert('카메라 접근 실패: '+e.message);
  }
}

function stopCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  cancelAnimationFrame(animId);
  video.style.display='none';
  output.style.display='none';
  document.getElementById('placeholder').style.display='flex';
  document.getElementById('btn-start').style.display='';
  ['btn-stop','btn-flip','btn-snap'].forEach(id=>document.getElementById(id).style.display='none');
}

function toggleFlip(){
  flipped=!flipped;
  const b=document.getElementById('btn-flip');
  b.innerHTML=flipped
    ?'<i class="ti ti-flip-horizontal" aria-hidden="true"></i> 반전 켜짐'
    :'<i class="ti ti-flip-horizontal" aria-hidden="true"></i> 반전 꺼짐';
}

function renderLoop(){
  if(!stream)return;
  const vw=video.videoWidth||640, vh=video.videoHeight||480;
  output.width=vw; output.height=vh;
  ctx.save();
  if(flipped){ctx.translate(vw,0);ctx.scale(-1,1);}
  ctx.drawImage(video,0,0,vw,vh);
  ctx.restore();
  applyCanvasFilters(vw,vh);
  animId=requestAnimationFrame(renderLoop);
}

function applyCanvasFilters(w,h){
  const bright=filters.bright/100;
  const contrast=(filters.contrast+100)/100;
  const sat=(filters.sat+100)/100;
  const warm=filters.warm/100;
  const smooth=filters.smooth/100;
  const sharp=filters.sharp/100;

  const cssFilter=[
    `brightness(${1+bright*0.8})`,
    `contrast(${contrast})`,
    `saturate(${sat})`,
    sharp>0?`sharpen(${sharp})`:'',
    smooth>0?`blur(${smooth*1.5}px)`:''
  ].filter(Boolean).join(' ');

  output.style.filter=cssFilter;

  if(warm!==0){
    const d=ctx.getImageData(0,0,w,h);
    const data=d.data;
    for(let i=0;i<data.length;i+=4){
      if(warm>0){
        data[i]=Math.min(255,data[i]+warm*30);
        data[i+2]=Math.max(0,data[i+2]-warm*20);
      }else{
        data[i]=Math.max(0,data[i]+warm*20);
        data[i+2]=Math.min(255,data[i+2]-warm*30);
      }
    }
    ctx.putImageData(d,0,0);
  }
}

function takeSnap(){
  const sc=document.getElementById('snap-canvas');
  sc.width=output.width; sc.height=output.height;
  const sctx=sc.getContext('2d');
  sctx.drawImage(output,0,0);
  const snap=document.getElementById('snap-result');
  snap.style.display='block';
  snap.scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
